# SQL-based authentication for Dovecot 2.4.1
# This file goes in /etc/dovecot/conf.d/ and overrides default authentication

# Authentication mechanisms
auth_mechanisms = plain login

# SQL password database using inline query format (Dovecot 2.4.1 syntax)
passdb sql {
  driver = pgsql
  connect = host=postgres dbname=emaildb user=emailuser password=emailpass
  password_query = SELECT email_accounts.email_address as user, \
    CASE \
      WHEN password_hash LIKE '{%}%' THEN password_hash \
      ELSE CONCAT('{PLAIN}', password_hash) \
    END as password, \
    domains.domain_name as domain \
    FROM email_accounts \
    INNER JOIN domains ON email_accounts.domain_id = domains.id \
    WHERE email_accounts.email_address = '%u' \
    AND email_accounts.is_active = true \
    AND domains.status = 'active'
}

# SQL user database using inline query format
userdb sql {
  driver = pgsql
  connect = host=postgres dbname=emaildb user=emailuser password=emailpass
  user_query = SELECT CONCAT('/srv/vmail/', LOWER(email_accounts.email_address)) as home, \
    5000 as uid, 5000 as gid, \
    CONCAT('*:bytes=', COALESCE(email_accounts.quota_mb, 1024), 'M') as quota_rule \
    FROM email_accounts \
    INNER JOIN domains ON email_accounts.domain_id = domains.id \
    WHERE email_accounts.email_address = '%u' \
    AND email_accounts.is_active = true \
    AND domains.status = 'active'
}
