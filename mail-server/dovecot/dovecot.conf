dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0
base_dir = /run/dovecot
state_dir = /run/dovecot
protocols = imap lmtp

# User settings
default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

# Environment variables for passwords
import_environment {
  USER_PASSWORD=%{env:USER_PASSWORD | default('testpass123')}
  DOVEADM_PASSWORD=%{env:DOVEADM_PASSWORD | default('supersecret')}
}

# Authentication configuration
auth_mechanisms = plain login

# Static authentication - using environment variable or default
passdb static {
  password=%{env:USER_PASSWORD}
}
userdb static {
  driver=prefetch
}

# Mail storage settings
mail_driver = maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_path = /var/mail/%u
mail_home = /srv/vmail/%{user | lower}
mail_utf8_extensions = yes
mail_uid = 5000
mail_gid = 5000

# SSL settings - disabled for testing
ssl = no

# Logging
log_path = /dev/stdout
auth_verbose = yes
auth_debug = yes

# Setup default mailboxes for inbox namespace
@mailbox_defaults = english
namespace inbox {
  separator = /
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Sent {
    special_use = \Sent
  }
}

# Mail attributes storage
mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}

# Performance and optimization settings
imap_hibernate_timeout = 5s

# Mail plugins for enhanced functionality
mail_plugins {
  fts = yes
  fts_flatcurve = yes
  mail_log = yes
  notify = yes
}

# Mail logging events
mail_log_events = delete undelete expunge save copy mailbox_create mailbox_delete mailbox_rename flag_change

# Full-text search configuration
fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999
fts_search_add_missing = yes
language_filters = normalizer-icu snowball stopwords
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple

language en {
  default = yes
  filters = lowercase snowball english-possessive stopwords
}

fts flatcurve {
  substring_search = yes
}

# Protocol specific settings
protocol imap {
  mail_max_userip_connections = 10
  mail_plugins {
     imap_sieve = yes
     imap_filter_sieve = yes
  }
}

# IMAP service configuration
service imap-login {
  inet_listener imap {
    port = 143
  }
  process_min_avail = 1
  client_limit = 100
}

service imap {
  process_limit = 1024
}

# Additional services for completeness
service pop3-login {
  process_min_avail = 1
  client_limit = 100
}

service doveadm {
  inet_listener http {
    port = 8080
    ssl = no
  }
}

service stats {
  process_min_avail = 1
  inet_listener http {
    port = 9090
    ssl = no
  }
}

# Doveadm password
doveadm_password = ${env:DOVEADM_PASSWORD}

# Event logging
event_exporter log {
   format = json
   time_format = rfc3339
}

# Add default backend metrics
@metric_defaults = backend

# Log auth failures
metric auth_failures {
  filter = event=auth_request_finished AND NOT success=yes
  exporter = log
}

metric imap_command {
  filter = event=imap_command_finished
  group_by cmd_name {
    method discrete {
    }
  }
  group_by tagged_reply_state {
    method discrete {
    }
  }
}

# Mail delivery metrics
metric mail_deliveries {
  filter = event=mail_delivery_finished
  group_by duration {
     method exponential {
       base = 10
       min_magnitude = 1
       max_magnitude = 5
     }
  }
}

# # Include additional configuration files
# !include_try vendor.d/*.conf
# !include_try conf.d/*.conf

# LMTP service configuration for mail delivery from Postfix
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# LMTP protocol settings
protocol lmtp {
  mail_plugins = 
}

